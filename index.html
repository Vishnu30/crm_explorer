<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CRM Use Case Explorer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>CRM Use Case Explorer</h1>
      <div class="controls">
        <div class="control">
          <label for="industrySelect">Industry</label>
          <select id="industrySelect"><option value="">Loading…</option></select>
        </div>
        <div class="control">
          <label for="usecaseSelect">Use case</label>
          <select id="usecaseSelect"><option value="">Select industry first</option></select>
        </div>
        <div class="control">
          <label for="platformSelect">Platform</label>
          <select id="platformSelect">
            <option value="moengage">MoEngage</option>
            <option value="braze">Braze</option>
          </select>
        </div>
      </div>
    </header>

    <main>
      <section id="stepsSection">
        <h2 id="usecaseTitle">Select an industry and use case</h2>
        <div id="stepsContainer" class="steps-box"></div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
